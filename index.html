<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AR Menu</title>
    <!-- Modern Model-Viewer Load -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        model-viewer { width: 100%; height: 400px; background-color: #e0e0e0; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Special Dish</h1>
        <model-viewer 
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            alt="3D model" 
            auto-rotate 
            camera-controls 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            ar-placement="floor"
            camera-orbit="0deg 90deg 2m">
        </model-viewer>
        <p>Tap the AR icon on the model to view on your table.</p>
    </div>
</body>
</html>
